version: '3.8'

services:
  gongwang_monitor:
    image: pantograph-subsystem-jetson:v1.0
    working_dir: /app
    container_name: gongwang_monitor
    restart: always
    command: tail -f /dev/null
    runtime: nvidia
    network_mode: "host"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TZ=Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /hirain/hi_opt/algo/gongwang_monitor:/app
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
