version: "3.8"

services:
  gongwang_monitor_vllm:
    image: pantograph-vllm-orin:v1.0
    container_name: gongwang_monitor
    restart: always
    runtime: nvidia
    network_mode: "host"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - VLLM_GPU_MEMORY=0.8
      - VLLM_MAX_MODEL_LEN=4096
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /hirain/hi_opt/nvme1/Algo-result:/app/local_cache/Algo-result
      - /hirain/hi_opt/algo/gongwang_monitor:/app
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
