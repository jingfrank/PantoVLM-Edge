version: '3.8'

services:
  gongwang_monitor:
    image: pantograph-subsystem-jetson:v2.0
    working_dir: /app
    container_name: gongwang_monitor
    restart: always
    command: python3 main.py config/config_prod.yaml
    runtime: nvidia
    network_mode: "host"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /hirain/hi_opt/algo/gongwang_monitor:/app
      - /hirain/hi_opt/nvme1/Algo-result:/app/local_cache/Algo-result
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

